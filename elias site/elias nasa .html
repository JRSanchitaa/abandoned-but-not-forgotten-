<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abandoned, But Not Forgotten</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#07071a;--panel:#12123a;--line:#6fd3ff;--moon:#9c9886;--mars:#c4562f;--gold:#ffd166;--ink:#f2f4ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg) radial-gradient(#fff 1px,transparent 1px) 0 0/90px 90px;color:var(--ink);font-family:"Press Start 2P",ui-monospace,monospace;font-size:12px;line-height:1.9;image-rendering:pixelated}
#app{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:22px;line-height:1.5;color:var(--gold)}h2{font-size:15px;color:var(--gold);margin:10px 0 0}h3{font-size:13px}
button{font:inherit;font-size:11px;background:var(--gold);color:#201a00;border:0;padding:10px 14px;margin:6px 6px 0 0;cursor:pointer;box-shadow:0 4px #a67c00}
button:active{transform:translateY(3px);box-shadow:0 1px #a67c00}button:disabled{background:#4caf7a;color:#fff;box-shadow:none}
button:focus-visible{outline:3px solid var(--line)}
.bar{flex-wrap:wrap;display:flex;justify-content:space-between;align-items:center;gap:8px;border:3px solid var(--line);padding:6px 10px;background:var(--panel)}
.stage{position:relative;height:230px;margin:12px 0;border:3px solid var(--line);display:flex;align-items:flex-end;justify-content:center;gap:24px;overflow:hidden;background:linear-gradient(#0a0a2a,#1a1a4a)}
.stage.moon{background:linear-gradient(#0a0a2a 55%,var(--moon) 55%)}.stage.mars{background:linear-gradient(#3a1a2a 55%,var(--mars) 55%)}
.icon{font-size:70px;line-height:1;padding-bottom:30px}.el{width:170px;height:auto;max-height:190px;object-fit:contain;font-size:80px;text-align:center;line-height:1.5;margin-bottom:6px;animation:fl 2.6s ease-in-out infinite;filter:drop-shadow(0 0 10px #4aa8ff)}
.el.spin{animation:sp 1.8s ease-out 1,fl 2.6s ease-in-out 1.8s infinite}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
@keyframes sp{from{transform:rotate(0) scale(.3)}to{transform:rotate(720deg) scale(1)}}
.map{font-size:22px}
.tag{color:var(--line)}.box{background:var(--panel);border:3px solid var(--line);padding:6px 14px;min-height:60px}.box b{color:var(--gold)}
.fact{border:3px dashed var(--gold);padding:10px;margin:10px 0;color:#ffe9a8}
.field{position:relative;height:190px;border:3px solid var(--line);background:#0c0c2e;overflow:hidden}
.tg{position:absolute;font-size:34px;line-height:1;cursor:pointer;transition:all .2s}
.lz{position:relative;height:22px;background:#222;border:2px solid var(--line);margin:8px 0}.lz i{position:absolute;left:38%;width:22%;top:0;bottom:0;background:#2e9d5b}
.lz span{position:absolute;top:0;bottom:0;width:12px;background:var(--gold)}
.ln{display:flex;align-items:center;gap:8px;font-size:30px}.ln b{height:6px;width:0;background:#ff4d4d;transition:width 1s;box-shadow:0 0 10px #f55}
canvas{width:100%;max-width:640px;border:3px solid var(--line);display:block;touch-action:none}
.pad button{width:54px;height:46px}
#o button{display:block;width:100%;text-align:left}#o button.ok{background:#4caf7a;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{border:3px solid var(--line);background:var(--panel);padding:8px 10px}.card p{font-size:10px;margin:6px 0 0}.card small{display:block;color:var(--line)}
.ov{position:fixed;inset:0;background:rgba(5,5,20,.97);overflow:auto;padding:16px;z-index:9}
.sj{text-align:center;margin:20px 0;font-size:14px}.sj>*{display:block;opacity:0;animation:in .7s forwards}
.sj s{color:#888}.sj s:nth-child(2){animation-delay:1.2s}.sj b{color:var(--gold);font-size:18px;animation-delay:2.4s}
@keyframes in{to{opacity:1}}
@media(prefers-reduced-motion:reduce){.el,.sj>*{animation:none;opacity:1}.ln b{transition:none}}

.icon,.el{position:relative;z-index:1}
.stage.moon::after,.stage.mars::after{content:"";position:absolute;left:0;right:0;bottom:0;top:55%;pointer-events:none}
.stage.moon::after{background:
radial-gradient(ellipse 38px 10px at 8% 30%,#5d5a4e 55%,#d6d1bb 62%,transparent 68%),
radial-gradient(ellipse 22px 6px at 27% 72%,#5d5a4e 55%,#d6d1bb 62%,transparent 68%),
radial-gradient(ellipse 56px 14px at 52% 38%,#5d5a4e 55%,#d6d1bb 62%,transparent 68%),
radial-gradient(ellipse 26px 7px at 72% 78%,#5d5a4e 55%,#d6d1bb 62%,transparent 68%),
radial-gradient(ellipse 44px 11px at 91% 34%,#5d5a4e 55%,#d6d1bb 62%,transparent 68%),
radial-gradient(ellipse 14px 4px at 40% 86%,#5d5a4e 55%,#d6d1bb 62%,transparent 68%),
radial-gradient(#b4b09c 1px,transparent 1.5px) 0 0/19px 15px}
.stage.mars::after{background:
radial-gradient(ellipse 34px 9px at 14% 36%,#6e2713 55%,#e48e5e 62%,transparent 68%),
radial-gradient(ellipse 44px 11px at 80% 52%,#6e2713 55%,#e48e5e 62%,transparent 68%),
radial-gradient(ellipse 16px 8px at 40% 72%,#4f1a0b 60%,transparent 66%),
radial-gradient(ellipse 12px 6px at 62% 28%,#4f1a0b 60%,transparent 66%),
radial-gradient(ellipse 18px 8px at 92% 82%,#4f1a0b 60%,transparent 66%),
repeating-linear-gradient(172deg,transparent 0 14px,rgba(70,20,10,.3) 14px 17px),
radial-gradient(#8f3a1f 1.5px,transparent 2px) 0 0/15px 11px,
radial-gradient(#e59a6c 1px,transparent 1.5px) 6px 5px/21px 17px}
.tg.sig{color:#8dffc8;font-size:40px;font-weight:bold;text-shadow:0 0 10px #8dffc8,0 0 22px #3dffa0;animation:shk .25s linear infinite}
@keyframes shk{25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-3px)}}
.hl{position:absolute;left:0;right:0;top:27%;border-top:2px dashed #8dffc8}.hl i{font-style:normal;font-size:9px;color:#8dffc8;background:#0c0c2e;padding:0 4px}
.meter{height:14px;border:2px solid var(--line);margin:8px 0;background:#111}.meter b{display:block;height:100%;width:0;background:var(--gold)}
@media(prefers-reduced-motion:reduce){.tg.sig{animation:none}}
small.cr{display:block;margin-top:24px;font-size:9px;color:#8f93c9}
</style>
</head>

const sy=window.speechSynthesis;let VOICE=true,PITCH=1.5,RATE=.9,VN="";
const vi=()=>VOICE?"🔊":"🔇";
const pick=()=>{const v=sy.getVoices().filter(x=>/^en/i.test(x.lang)),nm=v.find(x=>x.name==VN),m=x=>/male|david|daniel|guy|mark|james|alex|ryan|george|fred/i.test(x.name)&&!/female/i.test(x.name);return nm||v.find(x=>x.localService&&m(x))||v.find(x=>x.localService)||v.find(m)||v[0]};
const speak=(t,cut)=>{if(!sy||!VOICE)return;if(cut)sy.cancel();const u=new SpeechSynthesisUtterance(t.replace(/2-24 b/g,"two twenty-four b").replace(/…/g,"...").replace(/ALSEP/g,"alsep").replace(/km\/h/g,"kilometres per hour"));const v=pick();if(v){u.voice=v;u.lang=v.lang}else u.lang="en-US";u.pitch=PITCH;u.rate=RATE;sy.speak(u)};
const vtog=()=>{VOICE=!VOICE;if(sy&&!VOICE)sy.cancel();document.querySelectorAll(".vb").forEach(b=>b.textContent=vi())};
const found=()=>B.filter(b=>b.d).length,TOTAL=()=>S.filter(s=>s.d).length;
const cards=()=>B.length?B.map(b=>`<div class="card"><b>${b.ic} ${b.t}</b><small>${b.y}</small><p>${b.k}</p></div>`).join(""):"<p>Empty so far…</p>";

/* ---------- mini-games: each one calls done() when won ---------- */
const tap=(ic,goal,cls="")=>done=>{let k=0;
  $("#x").innerHTML=`<p>🎮 ${goal} (<span id="k">0</span>/3)</p><div class="field"><span id="t" class="tg ${cls}">${ic}</span></div>`;
  const t=$("#t"),mv=()=>{t.style.left=Math.random()*85+"%";t.style.top=Math.random()*75+"%"};mv();
  t.onclick=()=>{$("#k").textContent=++k;k>=3?done():mv()}};

const order=(st=["🚀 Cruise stage","🔥 Atmospheric entry","🛡 Heat shield","🪂 Parachute","⬇️ Descent system","🤖 Rover touches down"],q="Click the landing steps in the right order.")=>done=>{let k=0;
  $("#x").innerHTML=`<p>🎮 ${q}</p><div id="o"></div><p id="lr"></p>`;
  st.map((s,j)=>[s,j]).sort(()=>Math.random()-.5).forEach(([s,j])=>{const b=document.createElement("button");b.textContent=s;
    b.onclick=()=>{if(j==k){b.disabled=true;$("#lr").textContent=`${++k} of ${st.length} correct`;if(k==st.length)done()}else $("#lr").textContent="Not yet! Think about what happens first."};$("#o").append(b)})};

const laser=done=>{
  $("#x").innerHTML=`<p>🎮 Aim the laser at the Moon (▲ ▼ or W/S keys), then FIRE. The Moon keeps moving!</p><canvas id="lc" width="640" height="200"></canvas><div class="pad"><button id="up">▲</button><button id="dn">▼</button><button id="fr">🔴 FIRE</button></div><p id="lr"></p>`;
  const c=$("#lc").getContext("2d");let ay=100,v=0,t=0,bp=-1,hit=0;
  const fire=()=>{if(bp<0){bp=0;hit=Math.abs(ay-(100+70*Math.sin(t)))<32}};
  const kd=e=>{if(e.key=="ArrowUp"||e.key=="w")v=-1.5;if(e.key=="ArrowDown"||e.key=="s")v=1.5;if(e.key==" "){fire();e.preventDefault()}};
  const ku=e=>{if(["ArrowUp","ArrowDown","w","s"].includes(e.key))v=0},off=()=>{removeEventListener("keydown",kd);removeEventListener("keyup",ku)};
  addEventListener("keydown",kd);addEventListener("keyup",ku);
  $("#up").onpointerdown=()=>v=-1.5;$("#dn").onpointerdown=()=>v=1.5;$("#up").onpointerup=$("#dn").onpointerup=$("#up").onpointerleave=$("#dn").onpointerleave=()=>v=0;$("#fr").onclick=fire;
  (function f(){if(!$("#lc")){off();return}
    t+=.03;ay=Math.max(15,Math.min(185,ay+v*2));const my=100+70*Math.sin(t);
    c.clearRect(0,0,640,200);c.font="40px serif";c.fillText("🌍",10,115);c.fillText("🌕",545,my+14);
    c.strokeStyle="#8dffc8";c.setLineDash([6,6]);c.beginPath();c.moveTo(70,100);c.lineTo(560,ay);c.stroke();c.setLineDash([]);
    if(bp>=0){bp+=.025;const q=bp<1?bp:2-bp;c.strokeStyle="#ff5a5a";c.lineWidth=4;c.beginPath();c.moveTo(70,100);c.lineTo(70+490*q,100+(ay-100)*q);c.stroke();c.lineWidth=1;
      if(bp>=1&&!hit){bp=-1;$("#lr").textContent="Missed! The Moon moved. Try again."}
      if(bp>=2){off();$("#lr").textContent="Laser bounced back! Earth–Moon distance measured.";setTimeout(done,1300);return}}
    requestAnimationFrame(f)})()};

const seismo=done=>{
  $("#x").innerHTML=`<p>🎮 Watch the Moon’s seismograph. When a big quake spike reaches the green box, press DETECT (or Space). Found: <span id="k">0</span>/3</p><canvas id="sc" width="640" height="160"></canvas><button id="dt">📡 DETECT</button><p id="lr"></p>`;
  const c=$("#sc").getContext("2d");let k=0,sp=[],gap=40,fr=0;
  const det=()=>{const s=sp.find(s=>Math.abs(s.x-120)<24&&!s.d);if(s){s.d=1;$("#k").textContent=++k;$("#lr").textContent="Moonquake detected!";if(k>=3){off();setTimeout(done,700)}}else $("#lr").textContent="Nothing in the box. Wait for a big spike."};
  const kd=e=>{if(e.code=="Space"){det();e.preventDefault()}},off=()=>removeEventListener("keydown",kd);
  addEventListener("keydown",kd);$("#dt").onclick=det;
  (function f(){if(!$("#sc")){off();return}
    fr++;if(--gap<=0){sp.push({x:640,d:0});gap=100+Math.random()*60}
    c.fillStyle="#0c0c2e";c.fillRect(0,0,640,160);c.fillStyle="rgba(141,255,200,.25)";c.fillRect(96,0,48,160);c.strokeStyle="#8dffc8";c.strokeRect(96,0,48,160);
    c.strokeStyle="#cfe9ff";c.lineWidth=2;c.beginPath();
    for(let x=0;x<=640;x+=4){let y=80+Math.sin((x+fr*3)*.3)*4+Math.sin(x*7+fr*5)*2;sp.forEach(s=>{const d=x-s.x;if(Math.abs(d)<26)y+=Math.cos(d*.9)*(55-Math.abs(d)*2)*(s.d?.15:1)});x?c.lineTo(x,y):c.moveTo(x,y)}
    c.stroke();sp.forEach(s=>s.x-=2.5);sp=sp.filter(s=>s.x>-40);requestAnimationFrame(f)})()};

const scan=(ic,goal,dec=["🪨","⚫"])=>done=>{
  $("#x").innerHTML=`<p>🎮 ${goal} Move your mouse or finger to shine a light. Found: <span id="k">0</span>/3</p><div class="field" id="sf" style="cursor:crosshair;touch-action:none"><div id="sv" style="position:absolute;inset:0;z-index:5;pointer-events:none;background:#05051a"></div></div><p id="lr"></p>`;
  const f=$("#sf");let k=0;
  const cells=[...Array(15).keys()].sort(()=>Math.random()-.5);
  const put=(e,t)=>{const q=cells.pop(),s=document.createElement("span");s.className="tg";s.style.cssText=`left:${(q%5)*18+3+Math.random()*7}%;top:${Math.floor(q/5)*33+2+Math.random()*10}%;z-index:${t?3:1};transition:none`;s.textContent=e;
    s.onclick=()=>{if(t){s.remove();$("#k").textContent=++k;$("#lr").textContent="Found one!";if(k>=3)done()}else $("#lr").textContent="Just a decoy. Keep looking!"};f.insertBefore(s,$("#sv"))};
  for(let i=0;i<3;i++)put(ic,1);for(let i=0;i<6;i++)put(dec[i%dec.length],0);
  const mv=e=>{const r=f.getBoundingClientRect();$("#sv").style.background=`radial-gradient(circle 80px at ${e.clientX-r.left}px ${e.clientY-r.top}px,transparent 0,transparent 40px,#05051a 80px)`};
  f.onpointermove=f.onpointerdown=mv;mv({clientX:-999,clientY:-999})};

const heli=done=>{
  $("#x").innerHTML=`<p>🎮 Hold SPIN ROTOR (or Space). At 62% rotor speed Ingenuity lifts off. Tap gently to hover inside the dashed zone for 10 seconds!</p><div class="field" id="hf" style="background:linear-gradient(#0c0c2e 90%,#8a3a20 90%)"><div class="hl" style="top:28%"><i>hover zone</i></div><span id="hc" class="tg" style="left:46%;top:72%;transition:none">🚁</span></div><p>Rotor</p><div class="meter"><b id="rb"></b></div><p>Hover time</p><div class="meter"><b id="hb" style="background:#8dffc8"></b></div><button id="sp">🔄 HOLD TO SPIN ROTOR</button><p id="hs"></p>`;
  let r=0,y=0,hold=0,hv=0;const N=334;
  const kd=e=>{if(e.code=="Space"){hold=1;e.preventDefault()}},ku=e=>{if(e.code=="Space")hold=0},off=()=>{removeEventListener("keydown",kd);removeEventListener("keyup",ku)};
  addEventListener("keydown",kd);addEventListener("keyup",ku);
  const b=$("#sp");b.onpointerdown=()=>hold=1;b.onpointerup=b.onpointerleave=()=>hold=0;
  const iv=setInterval(()=>{
    if(!$("#hf")){clearInterval(iv);off();return}
    r=hold?Math.min(100,r+3):Math.max(0,r-2);
    y=r>62?Math.min(100,y+(r-62)*.02):Math.max(0,y-.8);
    $("#hc").style.top=(72-y*.64)+"%";$("#hc").style.marginLeft=(r>5?(Math.random()-.5)*r/12:0)+"px";
    hv=(y>40&&y<90)?hv+1:Math.max(0,hv-.5);
    $("#rb").style.width=r+"%";$("#hb").style.width=Math.min(100,hv/N*100)+"%";
    $("#hs").textContent=y<2&&r<62?"Rotor "+Math.round(r)+"%. Needs 62% to lift off.":(y>40&&y<90)?"Hovering… "+(hv*.03).toFixed(1)+" s / 10 s":y>=90?"Too high! Let go for a moment.":"Climb to the dashed zone.";
    if(hv>=N){clearInterval(iv);off();done()}
  },30)};

const quiz=qs=>done=>{let i=0;const show=()=>{const q=qs[i];$("#x").innerHTML=`<p>🎮 Question ${i+1} of ${qs.length}: ${q[0]}</p><div id="o"></div><p id="lr"></p>`;
  q[1].map((a,j)=>[a,j]).sort(()=>Math.random()-.5).forEach(([a,j])=>{const b=document.createElement("button");b.textContent=a;b.onclick=()=>{if(j==q[2]){if(++i>=qs.length)done();else show()}else $("#lr").textContent="Not quite. Try another answer."};$("#o").append(b)})};show()};

const track=(ic,goal)=>done=>{
  $("#x").innerHTML=`<p>🎮 ${goal} Keep your pointer on the moving target to fill the signal bar.</p><div class="field" id="tf" style="touch-action:none"><span id="tt" class="tg" style="transition:none;left:40%;top:40%">${ic}</span></div><div class="meter"><b id="tb"></b></div>`;
  const f=$("#tf"),t=$("#tt");let a=0,s=0,mx=-999,my=-999;
  f.onpointermove=f.onpointerdown=e=>{mx=e.clientX;my=e.clientY};f.onpointerleave=()=>mx=-999;
  const iv=setInterval(()=>{if(!$("#tf")){clearInterval(iv);return}
    a+=.03;t.style.left=(42+36*Math.sin(a*1.3))+"%";t.style.top=(40+30*Math.sin(a*.9+1))+"%";

  say()}

  if(n<c.l.length)$("#x").innerHTML=`<button onclick="say()">▶ NEXT</button>`;
  else{speak("Fact card. "+c.f);$("#box").innerHTML+=`<div class="fact">📋 FACT CARD<br>${c.f}</div>`;$("#x").innerHTML="";c.g&&!B.some(b=>b.t==c.t)?(c.g(fin),setTimeout(i=>{if(cur==i&&$("#x")&&!$("#x .go"))$("#x").insertAdjacentHTML("beforeend",`<button onclick="fin()">⏭ SKIP GAME</button>`)},20000,cur)):fin()}}
function fin(){const c=S[cur];
  if(c.k&&!B.some(b=>b.t==c.t)){B.push({ic:c.ic,t:c.t,y:c.y,k:c.k,d:c.d});speak("Scrapbook. "+c.k)}

function back(){cur>0?play(cur-1):home()}
function go(){cur<S.length-1?play(cur+1):end()}
function book(){const o=document.createElement("div");o.className="ov";
